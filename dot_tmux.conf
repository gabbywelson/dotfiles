set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -s escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string '#h:#S #W'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "config reloaded"
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g status-interval 5
set -g @host_bg "colour24"
source-file -q ~/.config/tmux/host-color.conf
set -gF status-style "bg=#{@host_bg},fg=colour255"
set -g status-left "#[bold] #h #[nobold]│ #S │ "
set -g status-left-length 36
set -g status-right "%Y-%m-%d %H:%M "
setw -g window-status-current-style "bold reverse"
