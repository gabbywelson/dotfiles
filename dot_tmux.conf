# ~/.tmux.conf - managed by chezmoi (~/dotfiles/dot_tmux.conf). Shared by macOS and Linux.
# Plugins via tpm (~/.tmux/plugins/tpm, installed by chezmoi). Install/update: prefix + I / prefix + U.

# --- Prefix: Ctrl-a ----------------------------------------------------------
unbind C-b
set -g prefix C-a
# Nested tmux (Mac tmux -> ssh pluto -> tmux): Ctrl-a Ctrl-a sends the prefix inward.
bind C-a send-prefix

# --- Terminal & behavior -----------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB,xterm-ghostty:RGB'
set -s escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
# Make an SSH-attached tmux session unmistakable in the local terminal tab.
set -g set-titles-string '#{?SSH_CONNECTION,SSH • ,}#h:#S #W'

# --- Keys ----------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "config reloaded"
bind -n M-Left select-pane -L          # Alt-arrows move between panes, no prefix
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

setw -g mode-keys vi                   # prefix [ to scroll/copy, v to select, y to copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Plugins -------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix Ctrl-s save, prefix Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save every 15 min, restore on start

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# --- Theme: Catppuccin Mocha ---------------------------------------------------
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
# Per-machine accent for the host pill (blue on the Mac, mauve on Linux hosts).
source-file -q ~/.config/tmux/host-color.conf

run '~/.tmux/plugins/tpm/tpm'

set -g status-position top
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_host}#{E:@catppuccin_status_date_time}"
