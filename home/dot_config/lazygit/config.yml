# lazygit: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
# Colors are not set here: the `lazygit` shell function (~/.config/zsh/80-functions.zsh)
# layers themes/latte.yml or themes/mocha.yml on top via LG_CONFIG_FILE, matching
# whatever Ghostty is showing. Those theme files are fetched by chezmoi.
gui:
  nerdFontsVersion: "3"
  showRandomTip: false
  showNumstatInFilesView: true
  showDivergenceFromBaseBranch: arrowAndNumber
git:
  # `|` cycles renderers: delta (line diff), then difftastic (syntax-aware diff).
  diffRenderers:
    - colorArg: always
      command: delta --paging=never
    - command: difft --color=always
      type: extDiff
