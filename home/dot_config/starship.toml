"$schema" = "https://starship.rs/config-schema.json"

# Starship prompt: https://starship.rs/config/
#
#   ( ~/c/dotfiles )( main ) !2 ?1 ⇡1 ·····················  22.11  3.12  4s  21:04
#   ❯
#
# Colors are ANSI names (blue, green, purple = magenta, ...), never hex. Ghostty's Catppuccin theme
# decides what "blue" looks like, so the prompt matches Latte by day and Mocha by
# night, and stays correct over SSH. Pills are rounded caps
# (\ue0b6 \ue0b4) around `inverted` text, which takes the terminal's background
# color, so pill text has strong contrast in both flavors.
#
# Icons are \u escapes of Nerd Font code points, so they survive copy/paste and
# editors without a Nerd Font. Ghostty bundles the Nerd Font symbols.
#
# After you press Enter, ~/.config/zsh/60-prompt.zsh collapses this to a bare ❯.

format = """
$os\
$username\
$hostname\
$container\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$fill\
$nodejs\
$bun\
$deno\
$python\
$rust\
$golang\
$java\
$ruby\
$swift\
$docker_context\
$jobs\
$cmd_duration\
$time
$character"""

add_newline = true
command_timeout = 800

[fill]
symbol = " "

# --- Where am I ------------------------------------------------------------------

[os]
disabled = false
format = "[$symbol]($style)"
style = "bold blue"

[os.symbols]
Macos = "\U000F0035 "
Debian = "\U000F08DA "
Ubuntu = "\U000F0548 "
Linux = "\U000F033D "
Raspbian = "\U000F043F "
Fedora = "\U000F08DB "
Arch = "\U000F08C7 "
Windows = "\U000F05B3 "

# user@host shows up only over SSH (or as root), in red so a server never looks
# like your laptop.
[username]
format = "[$user]($style)"
style_user = "bold red"
style_root = "bold red"

[hostname]
ssh_only = true
ssh_symbol = ""
format = "[@$hostname]($style) "
style = "bold red"

[container]
format = "[\U000F01A7 $name]($style) "
style = "bold cyan"

[directory]
format = "[\ue0b6](fg:blue)[ $path]($style)[$read_only]($read_only_style)[ ](bold fg:blue inverted)[\ue0b4](fg:blue) "
style = "bold fg:blue inverted"
read_only = " \U000F033E"
read_only_style = "fg:blue inverted"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false  # always show where you are from ~

# --- Git ---------------------------------------------------------------------------

[git_branch]
format = "[\ue0b6](fg:green)[ $symbol$branch(:$remote_branch) ]($style)[\ue0b4](fg:green) "
symbol = "\U000F062C "
style = "bold fg:green inverted"
truncation_length = 32

[git_commit]
format = "[\U000F0718 $hash$tag]($style) "
style = "bold green"
tag_symbol = " \U000F04F9 "

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "bold yellow"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow"
conflicted = "=$count "
ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇕⇡$ahead_count⇣$behind_count "
untracked = "?$count "
stashed = "≡ "
modified = "!$count "
staged = "+$count "
renamed = "»$count "
deleted = "✘$count "

# --- Toolchains (right side; each appears only inside a matching project) ---------

[nodejs]
format = "[$symbol($version)]($style) "
symbol = "\U000F0399 "
style = "green"
version_format = "${major}.${minor}"

[bun]
format = "[$symbol($version)]($style) "
symbol = "bun "
style = "purple"
version_format = "${major}.${minor}"

[deno]
format = "[$symbol($version)]($style) "
symbol = "\ue7c0 "
style = "green"
version_format = "${major}.${minor}"

[python]
format = "[$symbol$pyenv_prefix($version)( \\($virtualenv\\))]($style) "
symbol = "\U000F0320 "
style = "yellow"
version_format = "${major}.${minor}"

[rust]
format = "[$symbol($version)]($style) "
symbol = "\U000F1617 "
style = "red"
version_format = "${major}.${minor}"

[golang]
format = "[$symbol($version)]($style) "
symbol = "\U000F07D3 "
style = "cyan"
version_format = "${major}.${minor}"

[java]
format = "[$symbol($version)]($style) "
symbol = "\U000F0B37 "
style = "red"
version_format = "${major}"

[ruby]
format = "[$symbol($version)]($style) "
symbol = "\U000F0D2D "
style = "red"
version_format = "${major}.${minor}"

[swift]
format = "[$symbol($version)]($style) "
symbol = "\U000F06E5 "
style = "red"
version_format = "${major}.${minor}"

[docker_context]
format = "[$symbol$context]($style) "
symbol = "\U000F0868 "
style = "blue"
only_with_files = true

# --- Timing ------------------------------------------------------------------------

[jobs]
format = "[$symbol$number]($style) "
symbol = "✦"
style = "bold purple"

# Long commands also raise a macOS notification when Ghostty isn't focused
# (notify-on-command-finish in ~/.config/ghostty/config).
[cmd_duration]
min_time = 2000
format = "[\U000F051B $duration]($style) "
style = "yellow"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "bright-black"

# --- Input line -----------------------------------------------------------------------

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
