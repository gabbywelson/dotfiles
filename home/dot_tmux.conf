# ~/.tmux.conf: managed by chezmoi (~/dotfiles/home/dot_tmux.conf). Shared by macOS and Linux.
# Plugins via tpm (~/.tmux/plugins/tpm, installed by chezmoi): prefix I installs, prefix U updates.
# On Linux hosts, SSH logins attach to the session "main" (see ~/.config/zsh/00-ssh-tmux.zsh).

# --- Prefix: Ctrl-a -----------------------------------------------------------------
unbind C-b
set -g prefix C-a
# Nested tmux (Mac tmux -> ssh pluto -> tmux): Ctrl-a Ctrl-a sends the prefix inward.
bind C-a send-prefix

# --- Terminal -------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB,xterm-ghostty:RGB:hyperlinks:extkeys'
set -g extended-keys on          # Shift-Enter, Ctrl-Shift-… reach apps (Claude Code, nvim)
set -g allow-passthrough on      # inline images (yazi previews) through tmux
set -g set-clipboard on          # copy in tmux lands in your local clipboard, even over SSH
set -s escape-time 10
set -g focus-events on

# --- Behavior -------------------------------------------------------------------------
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off     # closing a session's last window switches to another session
set -g display-time 2000
set -g set-titles on
# Make an SSH-attached tmux session unmistakable in the local terminal tab.
set -g set-titles-string '#{?SSH_CONNECTION,SSH • ,}#h:#S #W'

# --- Keys ------------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "config reloaded"
bind -n M-Left select-pane -L          # Alt-arrows move between panes, no prefix
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Popups: prefix g = lazygit, prefix y = yazi, prefix f = fuzzy-switch sessions.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "zsh -ic lazygit"
bind y display-popup -E -w 90% -h 90% -d "#{pane_current_path}" yazi
bind f display-popup -E -w 50% -h 40% "tmux list-sessions -F '#S' | fzf --reverse --prompt='session ❯ ' | xargs -r tmux switch-client -t"

setw -g mode-keys vi                   # prefix [ to scroll/copy, v to select, y to copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Plugins -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix Ctrl-s save, prefix Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save every 15 min, restore on start

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# --- Theme: Catppuccin Mocha ----------------------------------------------------------------
# The status bar paints its own background, so Mocha reads fine in Ghostty's light mode too.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
# Per-machine accent for the host pill (blue on the Mac, mauve on Linux hosts).
source-file -q ~/.config/tmux/host-color.conf

# The status line is set *before* tpm runs: tmux-continuum hooks its 15-minute
# auto-save into status-right, and setting it afterwards would silently drop that.
set -g status-position top
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_host}#{E:@catppuccin_status_date_time}"

run '~/.tmux/plugins/tpm/tpm'
